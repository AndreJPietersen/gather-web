name: CI

# Runs on every pull request and on pushes to main and develop.
#
# "checks" is the required gate: typecheck, lint, unit tests and a production
# build. It needs no database — every page is dynamic, so `next build` never
# talks to Supabase; the values below are placeholders only so the code that
# reads them at import time doesn't crash.
#
# The end-to-end and security suites (npm run e2e, e2e/README.md) are NOT in
# CI yet: they need a Supabase stack seeded with the test accounts and demo
# data, which is epic L2 ("QA seed data") in docs/gather_launch_roadmap.md.
# Once a seed script exists, add a job that runs `supabase start`,
# `npm run db:migrate`, the seed, `npm run dev`, then `npm run e2e`.

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
