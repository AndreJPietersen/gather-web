name: CI

# Runs on every pull request and on pushes to main and develop.
#
# "checks" is the required gate: typecheck, lint, unit tests and a production
# build. It needs no database — every page is dynamic, so `next build` never
# talks to Supabase; the values below are placeholders only so the code that
# reads them at import time doesn't crash.
#
# "e2e" runs the Playwright end-to-end and security suites (e2e/README.md)
# against a throwaway local Supabase stack that is built from nothing by the
# migration runner and filled by the seed script. It is deliberately NOT a
# required check yet: make it required in the rulesets once it has been green
# on GitHub for a while.

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # "typecheck" first generates PageProps / LayoutProps (Next writes them
      # into .next/types, which a fresh checkout doesn't have) and then runs tsc.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GATHER_ENV: ci
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BASE_URL: http://localhost:3000
      E2E_MAILPIT_URL: http://127.0.0.1:54324
      E2E_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      EMAIL_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor
      - name: Export Supabase keys
        run: |
          npx supabase status -o env > /tmp/supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
          } >> "$GITHUB_ENV"
      - name: Build the database and seed it
        run: |
          npm run db:migrate
          npm run db:seed:reference
          npm run db:seed:demo
      # Fails the pull request if a migration changed the schema but
      # packages/db/src/database.types.ts was not regenerated (npm run db:types).
      - name: Check the generated database types are current
        run: npm run db:types:check
      - name: Build the app
        run: npm run build
      - name: Start the app
        run: |
          npm run start > /tmp/app.log 2>&1 &
          npx --yes wait-on http-get://localhost:3000 --timeout 60000
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run the e2e and security suites
        run: npm run e2e
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            playwright-report
            e2e/.output
            /tmp/app.log
          if-no-files-found: ignore
